description: "Manual weather backfill for START_DATE to END_DATE (YYYY-MM-DD). The extract Lambda times out at 300 s, so keep a run to about 3 months."
params:
  - name: START_DATE
    required: true
    pattern: '^\d{4}-\d{2}-\d{2}$'
    description: First day to fetch, YYYY-MM-DD
  - name: END_DATE
    required: true
    pattern: '^\d{4}-\d{2}-\d{2}$'
    description: Last day to fetch, YYYY-MM-DD
  - DATA_INGESTION_REF: main
  - INGEST_FUNCTION: mdb-prod-ingest-open-meteo

steps:
  - id: clone
    run: rm -rf /tmp/data-ingestion && git clone --depth 1 --branch "${DATA_INGESTION_REF}" https://github.com/maison-douce-bakery/data-ingestion.git /tmp/data-ingestion

  - id: extract
    depends: [clone]
    working_dir: /tmp/data-ingestion
    run: /opt/dlt/bin/python -m open_meteo.invoke --function "${INGEST_FUNCTION}" --start-date "${START_DATE}" --end-date "${END_DATE}"
    timeout_sec: 360 # seconds

  - id: load
    depends: [extract]
    working_dir: /tmp/data-ingestion
    run: /opt/dlt/bin/python -m open_meteo.load
    timeout_sec: 600 # seconds
